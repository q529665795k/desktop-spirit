name: release-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.3
          cache: true

      - name: Regenerate clean Android v2 skeleton
        run: |
          set -e
          # 仓库历史遗留的 android/ 只有一个 AndroidManifest.xml，Gradle 工程整体缺失，
          # 直接构建会报 "deleted Android v1 embedding"，在残缺目录上 flutter create 合并又会出空包。
          # 彻底删掉后由 flutter create 生成一套与 Flutter 3.24.3 匹配的完整 v2 工程，再覆盖固化 Manifest。
          rm -rf android
          flutter create --platforms=android --org com.marvis --project-name desktop_spirit .
          cp ci/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          echo "=== MainActivity ==="
          find android -name "MainActivity.kt" -o -name "MainActivity.java"
          echo "=== applicationId / namespace ==="
          grep -rE "applicationId|namespace" android/app/build.gradle*
          echo "=== manifest markers ==="
          grep -E "flutterEmbedding|OverlayService|SYSTEM_ALERT_WINDOW" android/app/src/main/AndroidManifest.xml

      - name: Resolve packages
        run: |
          flutter clean
          flutter pub get

      - name: Generate asset directory declarations
        run: |
          set -e
          # "- assets/" 不递归子目录，而 PNG 全在 assets/<动作>/ 下 -> 必须逐目录声明。
          # 扫描含 PNG 的子目录自动重写 pubspec（在 flutter create/pub get 之后执行，不会被覆盖）。
          python3 ci/gen_assets.py
          flutter pub get
          echo "==== pubspec flutter section ===="
          sed -n '/^flutter:/,$p' pubspec.yaml

      - name: Verify bundle (Dart compiled + 66 PNG assets)
        run: |
          set -e
          flutter build bundle --debug
          # 1) Dart 代码必须真的编译出 kernel_blob.bin
          test -s build/flutter_assets/kernel_blob.bin && echo "OK kernel_blob.bin present"
          # 2) 58 张 PNG 必须全部进 bundle（egg 由 11 张残次图替换为 3 张关键帧素材）
          PNG=$(find build/flutter_assets/assets -type f -name '*.png' | wc -l | tr -d ' ')
          echo "bundle PNG count = $PNG"
          test "$PNG" -eq 58
          # 3) AssetManifest 不得为空 {}，且能索引到蛋帧
          grep -q "egg_01" build/flutter_assets/AssetManifest.json
          echo "OK AssetManifest non-empty"

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK contents
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" > /tmp/apk.txt
          # release 下 Dart 走 AOT，必须有 libapp.so，否则就是空壳
          grep -q "libapp.so" /tmp/apk.txt && echo "OK libapp.so (AOT) present"
          # flutter_assets 里 58 张 PNG 必须在
          PNG=$(grep -cE "flutter_assets/.*\.png" /tmp/apk.txt || true)
          echo "APK PNG count = $PNG"
          test "$PNG" -eq 58
          grep -q "egg_01" /tmp/apk.txt && echo "OK egg frame packaged"

          # 悬浮窗自检:OverlayService 真实类必须打进 dex。
          # 旧版 manifest 把类名误写成 id.flutter.* ，R8 会按错误引用把真实 Service 类裁掉，
          # 表现为悬浮窗服务起不来、蛋不显示。这里用 dex 内真实类描述符做硬校验。
          rm -rf /tmp/dex && mkdir -p /tmp/dex
          ( cd /tmp/dex && unzip -oq "$GITHUB_WORKSPACE/$APK" 'classes*.dex' )
          if cat /tmp/dex/classes*.dex | strings | grep -q "flutter/overlay/window/flutter_overlay_window/OverlayService"; then
            echo "OK OverlayService class present in dex"
          else
            echo "::error::OverlayService class missing from dex (manifest service name wrong / stripped by R8)"
            exit 1
          fi
          # 合并后的 Manifest 必须带 Android14 specialUse 前台服务类型,否则 startForeground 崩溃
          if grep -rls "PROPERTY_SPECIAL_USE_FGS_SUBTYPE" build/app/intermediates --include=AndroidManifest.xml | grep -q .; then
            echo "OK foregroundServiceType=specialUse merged"
          else
            echo "::error::specialUse foreground service type not found in merged manifest"
            exit 1
          fi
          echo "===== APK verified, not an empty shell, overlay service wired ====="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: desktop-spirit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
