name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.3
          cache: true

      - name: Create Android platform skeleton
        run: flutter create . --platforms=android --org com.marvis --project-name desktop_spirit

      - name: Restore pubspec assets declaration
        run: |
          git checkout -- pubspec.yaml || true
          echo "=== pubspec.yaml (after restore) ==="
          cat pubspec.yaml
          echo "=== assets png count ==="
          find assets -name "*.png" | wc -l

      - name: Patch AndroidManifest for overlay window
        run: |
          python3 - <<'PYEOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n        <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n        <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n        <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          if 'SYSTEM_ALERT_WINDOW' not in s:
              s = s.replace('<application', perms + '    <application', 1)
          services = '        <service\n            android:name="id.flutter.flutter_overlay_window.OverlayService"\n            android:permission="android.permission.SYSTEM_ALERT_WINDOW"\n            android:exported="false" />\n        <service\n            android:name="id.flutter.flutter_overlay_window.OverlayForegroundService"\n            android:exported="false" />\n'
          if 'OverlayService' not in s:
              s = s.replace('</application>', services + '    </application>', 1)
          open(p, 'w').write(s)
          print('manifest patched')
          PYEOF

      - name: Get packages
        run: flutter pub get

      - name: Diagnose asset bundling
        run: |
          echo "=== before clean ==="
          ls .dart_tool/flutter_build 2>/dev/null || echo "no flutter_build dir"
          cat build/flutter_assets/.last_build_id 2>/dev/null || echo "no last_build_id"
          rm -rf .dart_tool/flutter_build build
          echo "=== clean done, rebuilding ==="
          time flutter build bundle --release --verbose 2>&1 | tee /tmp/bundle.log | grep -iE "asset|kernel|compile|exception|error|Building|target" | head -60
          echo "=== tail of bundle log ==="
          tail -15 /tmp/bundle.log
          echo "=== flutter_assets ==="
          find build/flutter_assets -type f | head -80
          echo "=== AssetManifest.json ==="
          cat build/flutter_assets/AssetManifest.json 2>/dev/null | head -10

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: desktop-spirit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
